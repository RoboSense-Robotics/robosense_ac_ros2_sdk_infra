name: Docker Build and Push

on:
  push:
    branches:
      - main
      - 'v*'
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute sanitized Docker tag
        id: tag
        shell: bash
        run: |
          REF_NAME="${{ github.ref_name }}"
          # replace "/" with "-", lowercase, and collapse any disallowed characters
          SAFE_TAG="${REF_NAME//\//-}"
          SAFE_TAG="${SAFE_TAG,,}"
          SAFE_TAG="$(echo "$SAFE_TAG" | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g')"
          echo "tag=$SAFE_TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $SAFE_TAG"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/metrolla-inc/robosense_ac_ros2_sdk_infra:${{ steps.tag.outputs.tag }}
            ghcr.io/metrolla-inc/robosense_ac_ros2_sdk_infra:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/metrolla-inc/robosense_ac_ros2_sdk_infra:latest
          cache-to: type=registry,ref=ghcr.io/metrolla-inc/robosense_ac_ros2_sdk_infra:latest,mode=max
